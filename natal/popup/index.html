<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Campanha de Natal · pop-up</title>
<!--
==========================================================================
  POP-UP DA CAMPANHA DE NATAL
  Fica dentro do pop-up "Campanha de Natal" do Wix (bloco Incorporar HTML
  ocupando o pop-up inteiro). Tamanho do pop-up: 760 x 440 no computador
  e 320 x 560 no celular.

  - "Quero apadrinhar" leva à página /natal.
  - O X e o "Agora não" fecham o pop-up.
  Os dois funcionam pelo código do Velo do pop-up (wix/velo-popup-natal.js).

  EDITAR: textos no meio do código (comentários "EDITAR").
==========================================================================
-->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700;9..40,800&family=Fraunces:ital,opsz,wght@1,9..144,600&display=swap">
<style>
:root { --fundo: #26114a; --fundo-2: #4a2a80; --lilas: #c9a8ff; --lilas-claro: #f2dff8; --amarelo: #e8b950; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: transparent; font-family: "DM Sans", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
.cartao { position: relative; height: 100%; display: grid; grid-template-columns: 1.05fr .95fr; overflow: hidden; border-radius: 24px; color: #fff;
  background: radial-gradient(120% 90% at 0% 0%, var(--fundo-2) 0%, var(--fundo) 62%); }
.texto { position: relative; z-index: 1; display: flex; flex-direction: column; justify-content: center; padding: 40px 12px 40px 44px; }
.chapeu { display: inline-flex; align-items: center; gap: 8px; margin: 0 0 14px; font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--lilas-claro); }
.chapeu svg { width: 14px; height: 14px; color: var(--amarelo); }
h2 { margin: 0 0 14px; font-size: 40px; line-height: 1.04; font-weight: 800; letter-spacing: -.035em; }
h2 em { font-family: "Fraunces", Georgia, serif; font-style: italic; font-weight: 600; color: var(--lilas); letter-spacing: -.02em; }
p { margin: 0 0 24px; font-size: 16px; line-height: 1.55; color: var(--lilas-claro); max-width: 360px; }
.acoes { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
.botao { display: inline-flex; align-items: center; gap: 10px; min-height: 52px; padding: 0 26px; border: 0; border-radius: 999px; background: var(--lilas); color: #26114a; font: 800 16px "DM Sans", sans-serif; text-decoration: none; cursor: pointer; box-shadow: 0 10px 30px rgba(201, 168, 255, .35); transition: transform .2s; }
.botao:hover { transform: translateY(-2px); }
.depois { border: 0; background: none; color: var(--lilas-claro); font: 600 15px "DM Sans", sans-serif; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; padding: 8px 2px; }
.foto { position: relative; }
.foto img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 30%; }
.foto::before { content: ""; position: absolute; inset: 0; z-index: 1; background: linear-gradient(90deg, var(--fundo) 0%, rgba(38, 17, 74, 0) 28%); }
.brilho { position: absolute; z-index: 2; color: var(--amarelo); animation: brilhar 3s ease-in-out infinite; }
.brilho svg { width: 100%; height: 100%; }
.b1 { width: 22px; height: 22px; top: 32px; right: 40px; }
.b2 { width: 14px; height: 14px; top: 92px; right: 18px; animation-delay: 1s; }
.b3 { width: 16px; height: 16px; bottom: 54px; left: 46%; animation-delay: 2s; }
@keyframes brilhar { 0%, 100% { opacity: .35; transform: scale(.8) rotate(0); } 50% { opacity: 1; transform: scale(1.1) rotate(20deg); } }
.fechar { position: absolute; z-index: 3; top: 14px; right: 14px; width: 40px; height: 40px; border: 0; border-radius: 999px; background: rgba(255, 255, 255, .16); color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.fechar:hover { background: rgba(255, 255, 255, .28); }
a:focus-visible, button:focus-visible { outline: 3px solid var(--amarelo); outline-offset: 3px; }
@media (prefers-reduced-motion: reduce) { .brilho { animation: none; } .botao { transition: none; } }

/* CELULAR: foto em cima, texto embaixo */
@media (max-width: 560px) {
  .cartao { grid-template-columns: 1fr; grid-template-rows: 210px 1fr; border-radius: 20px; }
  .foto { order: -1; }
  .foto::before { background: linear-gradient(0deg, var(--fundo) 0%, rgba(38, 17, 74, 0) 45%); }
  .texto { padding: 6px 22px 24px; justify-content: flex-start; }
  h2 { font-size: 31px; }
  p { font-size: 15px; margin-bottom: 18px; }
  .acoes { flex-direction: column; align-items: stretch; gap: 6px; }
  .botao { justify-content: center; }
  .b3 { display: none; }
}
</style>
</head>
<body>
<div class="cartao" role="dialog" aria-labelledby="titulo" aria-describedby="descricao">
  <div class="texto">
    <!-- EDITAR: chamada, título e texto -->
    <p class="chapeu"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 0c.6 5.6 2.4 7.4 12 12-9.6 4.6-11.4 6.4-12 12-.6-5.6-2.4-7.4-12-12C9.6 7.4 11.4 5.6 12 0z"/></svg> Campanha de Natal 2026</p>
    <h2 id="titulo">Apadrinhe uma <em>criança</em> neste Natal.</h2>
    <p id="descricao">Um gesto de carinho pode transformar este fim de ano. Conheça as crianças que participam da campanha e faça parte de um Natal cheio de afeto.</p>
    <div class="acoes">
      <a class="botao" href="https://www.maiseducacao.org/natal" id="apadrinhar">Quero apadrinhar <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7M8 7h9v9"/></svg></a>
      <button type="button" class="depois" data-fechar>Agora não</button>
    </div>
  </div>
  <div class="foto">
    <img src="https://static.wixstatic.com/media/d2b534_0c39e5b99318437ab48a45ba647709ef~mv2.png" alt="Duas crianças sorrindo, participantes da campanha de Natal da AME">
    <span class="brilho b1"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 0c.6 5.6 2.4 7.4 12 12-9.6 4.6-11.4 6.4-12 12-.6-5.6-2.4-7.4-12-12C9.6 7.4 11.4 5.6 12 0z"/></svg></span><span class="brilho b2"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 0c.6 5.6 2.4 7.4 12 12-9.6 4.6-11.4 6.4-12 12-.6-5.6-2.4-7.4-12-12C9.6 7.4 11.4 5.6 12 0z"/></svg></span><span class="brilho b3"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 0c.6 5.6 2.4 7.4 12 12-9.6 4.6-11.4 6.4-12 12-.6-5.6-2.4-7.4-12-12C9.6 7.4 11.4 5.6 12 0z"/></svg></span>
  </div>
  <button type="button" class="fechar" data-fechar aria-label="Fechar"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
</div>
<script>
(function () {
  var noWix = window.parent !== window;
  function avisar(tipo) { if (noWix) window.parent.postMessage({ tipo: tipo }, "*"); }
  document.querySelectorAll("[data-fechar]").forEach(function (b) { b.addEventListener("click", function () { avisar("natal-fechar"); }); });
  document.getElementById("apadrinhar").addEventListener("click", function (ev) {
    if (!noWix) return;            /* fora do Wix, o link abre normalmente */
    ev.preventDefault(); avisar("natal-abrir");
  });
  document.addEventListener("keydown", function (ev) { if (ev.key === "Escape") avisar("natal-fechar"); });
})();
</script>
</body>
</html>
