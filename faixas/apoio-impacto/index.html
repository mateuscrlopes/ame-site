<title>Faixa 2 · entre Como apoiar e Nosso impacto</title>
<!--
==========================================================================
  FAIXA ANIMADA · Faixa 2 · entre Como apoiar e Nosso impacto
  Divide as seções Como apoiar e Nosso impacto. Fundo amarelo, logo da AME como separador e o 'Mais' que soma.

  COMO USAR NO WIX
  Adicionar > Incorporar código > Incorporar HTML (código) e cole tudo.
  Largura: total da página. Altura: 48 px no computador e 42 px no celular.

  COMO EDITAR
  Vá até "CONFIGURAÇÃO DA FAIXA", no script do fim do arquivo:
  frases, cores, separador, direção e velocidade ficam lá.
==========================================================================
-->
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}

.faixa-rail{width:100%;height:100%;overflow:hidden;display:flex;align-items:center;background:var(--f-fundo)}
.faixa-track{display:flex;flex:0 0 auto;width:max-content;will-change:transform;animation:faixa-run var(--f-speed,22s) linear infinite}
.faixa-track.direita{animation-direction:reverse}
.faixa-seq{display:flex;flex:0 0 auto;align-items:center}
.faixa-item{display:flex;flex:0 0 auto;align-items:center;gap:18px;padding:0 26px;white-space:nowrap;line-height:1;font-family:"DM Sans",Arial,sans-serif;font-size:clamp(15px,1.55vw,20px);font-weight:800;letter-spacing:-.02em;color:var(--f-texto)}
.faixa-item.alt{color:var(--f-destaque)}
.faixa-simbolo{width:17px;height:17px;color:var(--f-destaque);display:block;flex:0 0 auto}
.faixa-item.alt .faixa-simbolo{color:var(--f-texto)}
.faixa-simbolo.logo{width:auto;height:15px;aspect-ratio:1018/362.5}
.faixa-simbolo svg{width:100%;height:100%;display:block}
@keyframes faixa-run{from{transform:translateX(0)}to{transform:translateX(calc(-1 * var(--f-loop, 400px)))}}
@media(max-width:600px){.faixa-item{gap:12px;padding:0 18px;font-size:15px}.faixa-simbolo{width:14px;height:14px}.faixa-simbolo.logo{height:12px}}

</style>

<div class="faixa-rail" role="img" aria-label="Faixa animada">
  <div class="faixa-track"></div>
</div>

<script>
(() => {
  /* ======================================================================
     CONFIGURAÇÃO DA FAIXA
     EDITAR: tudo o que muda a faixa fica neste bloco.
     ====================================================================== */
  const CONFIG = {
    frases: ['+ futuro', '+ sonhos', '+ caminhos', '+ vozes', '+ oportunidades', '+ gente junto'],
    tema: 'amarelo',
    separador: 'logo',
    alternarCores: false,
    direcao: 'direita',
    velocidade: 60
  };
  /*
     frases:        as palavras que passam na faixa (quantas quiser)
     tema:          "ameixa" (roxo escuro), "roxo", "amarelo" ou "creme"
     separador:     "lapis" (ponta do lápis), "logo" (logo da AME) ou "nenhum"
     alternarCores: true = uma frase sim, outra não fica na cor de destaque
     direcao:       "esquerda" ou "direita"
     velocidade:    maior = mais rápido (70 é o padrão)
  */

  /* Paletas disponíveis (use o nome em CONFIG.tema) */
  const TEMAS = {
    ameixa:  { fundo: "#562568", texto: "#FCF8F0", destaque: "#E8B950" },
    roxo:    { fundo: "#614998", texto: "#FCF8F0", destaque: "#E8B950" },
    amarelo: { fundo: "#E8B950", texto: "#292530", destaque: "#562568" },
    creme:   { fundo: "#FCF8F0", texto: "#614998", destaque: "#562568" }
  };

  /* ---------------- daqui para baixo, normalmente não precisa editar ---------------- */
  const rail  = document.querySelector('.faixa-rail');
  const track = document.querySelector('.faixa-track');
  const tema  = TEMAS[CONFIG.tema] || TEMAS.ameixa;
  rail.style.setProperty('--f-fundo', tema.fundo);
  rail.style.setProperty('--f-texto', tema.texto);
  rail.style.setProperty('--f-destaque', tema.destaque);
  if (CONFIG.direcao === 'direita') track.classList.add('direita');
  rail.setAttribute('aria-label', 'Faixa com as frases: ' + CONFIG.frases.join(', '));

  const SIMBOLOS = {
    lapis: '<span class="faixa-simbolo"><svg viewBox="0 0 100 100" aria-hidden="true"><path fill="currentColor" d="M0 100 47.24 29.43C56.14 15.77 72.33 0 88.84 0H100V100Z"/></svg></span>',
    logo:  '<span class="faixa-simbolo logo"><svg aria-hidden="true"><use href="#logo-ame"/></svg></span>',
    nenhum: ''
  };

  function makeItem(text, alt) {
    const span = document.createElement('span');
    span.className = 'faixa-item' + (CONFIG.alternarCores && alt ? ' alt' : '');
    span.innerHTML = (SIMBOLOS[CONFIG.separador] || SIMBOLOS.lapis) + '<span class="faixa-palavra"></span>';
    span.querySelector('.faixa-palavra').textContent = text;
    return span;
  }

  function build() {
    track.style.animation = 'none';
    track.innerHTML = '';
    const seq = document.createElement('div');
    seq.className = 'faixa-seq';
    track.appendChild(seq);      /* precisa estar na página para medir a largura */
    let i = 0;
    /* Repete as frases até a sequência ficar maior que a largura visível */
    while (seq.getBoundingClientRect().width < rail.clientWidth * 1.35 || i < 4) {
      CONFIG.frases.forEach((text, idx) => seq.appendChild(makeItem(text, ((i * CONFIG.frases.length) + idx) % 2 === 1)));
      i++;
      if (i > 20) break;
    }
    track.appendChild(seq.cloneNode(true));
    const distance = Math.ceil(seq.getBoundingClientRect().width);
    if (!distance || !rail.clientWidth) { setTimeout(build, 200); return; }  /* bloco ainda sem tamanho: tenta de novo */
    track.style.setProperty('--f-loop', distance + 'px');
    track.style.setProperty('--f-speed', Math.max(18, distance / CONFIG.velocidade) + 's');
    track.offsetHeight;          /* reinicia a animação */
    track.style.animation = '';
  }

  /* Monta já na abertura (a faixa começa andando) e refaz se a tela mudar de tamanho */
  build();
  let raf;
  function rebuild() { cancelAnimationFrame(raf); raf = requestAnimationFrame(build); }
  window.addEventListener('resize', rebuild);
  window.addEventListener('load', rebuild);
  /* Refaz quando o Wix der (ou mudar) o tamanho do bloco */
  if ('ResizeObserver' in window) {
    let ultimaLargura = 0;
    new ResizeObserver(() => {
      if (rail.clientWidth && rail.clientWidth !== ultimaLargura) { ultimaLargura = rail.clientWidth; rebuild(); }
    }).observe(rail);
  }
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(rebuild);
})();
</script>
